name: Sync - Development (Manual)

on:
  workflow_dispatch: # Manual trigger only

jobs:
  sync_dev:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install chromium

      - name: Run Sync (DEV)
        env:
          APP_ENV: dev
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: python scripts/sync_hype.py
