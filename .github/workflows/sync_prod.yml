name: Sync - Production (Scheduled)

on:
  schedule:
    # Runs at 05:00 AM WIB (22:00 UTC) every day
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  sync_prod:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install chromium

      - name: Run Sync (PROD)
        env:
          APP_ENV: prod
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: python scripts/sync_hype.py
